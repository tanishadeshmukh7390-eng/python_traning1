{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

<h2>🤖 AI Study Assistant</h2>

<form method="POST">

<textarea
name="question"
class="form-control"
rows="5"
placeholder="Ask anything..."></textarea>

<button class="btn btn-primary mt-3">

Get Answer

</button>

</form>

{% if answer %}

<div class="card mt-4 p-4">

<h4>Answer</h4>

<p>{{ answer }}</p>

</div>

{% endif %}

</div>

{% endblock %}
