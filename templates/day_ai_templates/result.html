<!DOCTYPE html>
<html>
    <head>
        <title>AI Tips</title>
    </head>
    <body class="bg-light">
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <h4 class="fw-bold mb-3">AI Study Tips</h4>
                            <p class="fw-bold">Name: {{ name }}</p>
                            <p class="fw-bold">Username: {{ username }}</p>
                            <p class="fw-bold">Email: {{ email }}</p>
                            <div class="alert alert-info">{{ tip }}</div>
                            <a href="/" class="btn btn-primary">Try another</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </body>
</html>
